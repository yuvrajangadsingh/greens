name: Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # Test scripts directly (no brew)
  test-scripts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: bash sync.sh --version

      - name: Help
        run: bash sync.sh --help

      - name: Status (no config)
        run: bash sync.sh --status

      - name: Resync (no config)
        run: |
          # Should fail gracefully with no config
          bash sync.sh --resync 2>&1 || true

      - name: Reset (no config)
        run: echo "n" | bash sync.sh --reset

      - name: Setup wizard (non-interactive)
        run: |
          # Create a temp work dir with a fake git repo
          mkdir -p /tmp/test-work/fake-repo
          cd /tmp/test-work/fake-repo
          git init
          git remote add origin https://github.com/test-org/test-repo.git
          cd -

          # Create a temp mirror repo
          mkdir -p /tmp/test-mirror
          cd /tmp/test-mirror
          git init
          git commit --allow-empty -m "init"
          cd -

          # Add a remote to the mirror repo so the "already exists" path works
          cd /tmp/test-mirror
          git remote add origin https://github.com/testuser/test-mirror.git
          cd -

          # Pipe inputs to setup wizard:
          # Auth is auto-detected as HTTPS from fake-repo, so no auth_choice prompt.
          # 1. work dir
          # 2. PAT ready? (n)
          # 3. enter token now? (n)
          # 4. emails
          # 5. org name
          # 6. github username (empty)
          # 7. mirror email
          # 8. personal github username
          # 9. since (empty)
          # 10. copy messages (n)
          # 11-15. extra inputs for mirror/push prompts and scheduler
          #
          # timeout prevents infinite loop if inputs run out (prompt_mirror_url
          # spins on EOF). The || true keeps the step green regardless.
          printf '/tmp/test-work\nn\nn\ntest@test.com\ntest-org\n\npersonal@test.com\ntestuser\n\nn\n3\n3\nn\nn\n3\n' \
            | MIRROR_DIR=/tmp/test-mirror timeout 60 bash setup.sh || true

          # Verify config was created
          if [ -f "$HOME/.contrib-mirror/config" ]; then
            echo "Config created:"
            cat "$HOME/.contrib-mirror/config"
          else
            echo "WARN: Config not created (expected in non-interactive mode)"
          fi

      - name: Status (with config)
        run: |
          if [ -f "$HOME/.contrib-mirror/config" ]; then
            bash sync.sh --status
          else
            echo "Skipping — no config from setup test"
          fi

      - name: Resync (with config, no mirror remote)
        run: |
          # Should prompt for confirmation, we say no
          echo "n" | bash sync.sh --resync 2>&1 || true

      - name: Exact email matching
        run: |
          # Verify --author="<email>" does exact matching
          mkdir -p /tmp/test-exact-match && cd /tmp/test-exact-match
          git init
          # Commit with a longer email that contains a shorter one as substring
          GIT_AUTHOR_EMAIL="yuvraj@test.com" GIT_COMMITTER_EMAIL="yuvraj@test.com" \
            git commit --allow-empty -m "commit by yuvraj"
          GIT_AUTHOR_EMAIL="raj@test.com" GIT_COMMITTER_EMAIL="raj@test.com" \
            git commit --allow-empty -m "commit by raj"

          # Substring match (old behavior) would return both
          substring_count="$(git log --all --author="raj@test.com" --format="%H" | wc -l | tr -d ' ')"
          # Exact match (new behavior) should return only raj's commit
          exact_count="$(git log --all --author="<raj@test.com>" --format="%H" | wc -l | tr -d ' ')"

          echo "Substring match count: $substring_count (expected 2)"
          echo "Exact match count: $exact_count (expected 1)"

          if [ "$exact_count" -eq 1 ]; then
            echo "PASS: exact email matching works"
          else
            echo "FAIL: expected 1 commit for exact match, got $exact_count"
            exit 1
          fi

      - name: Mirror email in commits
        run: |
          # Verify MIRROR_EMAIL overrides author on commits
          mkdir -p /tmp/test-mirror-email && cd /tmp/test-mirror-email
          git init && git commit --allow-empty -m "init"
          mirror_env=(env GIT_AUTHOR_EMAIL="personal@test.com" GIT_COMMITTER_EMAIL="personal@test.com")
          GIT_AUTHOR_DATE="2026-01-01 12:00:00" GIT_COMMITTER_DATE="2026-01-01 12:00:00" \
            "${mirror_env[@]}" git commit --allow-empty -m "test" --quiet
          author_email="$(git log -1 --format='%ae')"
          if [ "$author_email" = "personal@test.com" ]; then
            echo "PASS: mirror commit authored as personal@test.com"
          else
            echo "FAIL: expected personal@test.com, got $author_email"
            exit 1
          fi

      - name: End-to-end mock sync
        run: |
          set -e
          base=/tmp/e2e-macos
          src="$base/source.git"
          work="$base/work"
          mirror="$base/mirror"
          mirror_bare="$base/mirror-bare"
          cache="$base/cache"
          cfg="$base/config"
          rm -rf "$base"
          mkdir -p "$base" "$work" "$mirror" "$cache"

          git init --bare --quiet "$src"

          tmp="$base/tmp-clone"
          git clone --quiet "$src" "$tmp"
          cd "$tmp"
          git config user.email "ci@test.com"
          git config user.name "CI"
          GIT_AUTHOR_DATE="2026-04-01T10:00:00" GIT_COMMITTER_DATE="2026-04-01T10:00:00" \
            git commit --allow-empty -m "matching commit 1" --quiet
          GIT_AUTHOR_DATE="2026-04-02T11:00:00" GIT_COMMITTER_DATE="2026-04-02T11:00:00" \
            git commit --allow-empty -m "matching commit 2" --quiet
          GIT_AUTHOR_EMAIL="other@test.com" GIT_COMMITTER_EMAIL="other@test.com" \
            GIT_AUTHOR_DATE="2026-04-03T12:00:00" GIT_COMMITTER_DATE="2026-04-03T12:00:00" \
            git commit --allow-empty -m "non-matching commit" --quiet
          git push -u origin HEAD --quiet
          cd - >/dev/null

          git clone --quiet "$src" "$work/source-repo"

          # macOS canonicalizes /tmp -> /private/tmp on first git access; never
          # hard-code the prefix or sync.sh's case-glob match silently fails
          origin_url="$(git -C "$work/source-repo" remote get-url origin)"
          remote_prefix="${origin_url%source.git}"
          echo "Origin URL: $origin_url"
          echo "REMOTE_PREFIX: $remote_prefix"

          git init --bare --quiet "$mirror_bare"
          cd "$mirror"
          git init --quiet
          git config user.email "init@test.com"
          git config user.name "Init"
          git remote add origin "$mirror_bare"
          git commit --allow-empty -m "init" --quiet
          git branch -M main
          git push origin main --quiet
          cd - >/dev/null

          # GITHUB_USERNAME omitted on purpose: setting it activates sync.sh's
          # gh-API branch (gh search prs / gh auth switch), which needs auth
          # the runner doesn't have. PERSONAL_GH_USER is read only by setup.sh.
          cat > "$cfg" <<EOF
          WORK_DIR="$work"
          EMAILS="ci@test.com"
          REMOTE_PREFIX="$remote_prefix"
          MIRROR_DIR="$mirror"
          MIRROR_EMAIL="mirror@test.com"
          SINCE="2026-01-01 00:00:00"
          COPY_MESSAGES="0"
          EOF

          CONTRIB_MIRROR_CONFIG="$cfg" CACHE_DIR="$cache" \
            bash sync.sh 2>&1 | tail -50

          count=$(git -C "$mirror" rev-list --count HEAD)
          echo "Mirror commits: $count"
          if [ "$count" -lt 3 ]; then
            echo "FAIL: expected >=3 (init + 2 mirrored), got $count"
            git -C "$mirror" log --oneline
            exit 1
          fi
          authors=$(git -C "$mirror" log --format='%ae' | sort -u | tr '\n' ' ')
          echo "Authors: $authors"
          if ! echo "$authors" | grep -q "mirror@test.com"; then
            echo "FAIL: no commits authored by mirror@test.com"
            git -C "$mirror" log --pretty='%h %ae %s'
            exit 1
          fi
          if echo "$authors" | grep -q "ci@test.com"; then
            echo "FAIL: original work email leaked into mirror"
            exit 1
          fi
          if echo "$authors" | grep -q "other@test.com"; then
            echo "FAIL: non-matching email leaked into mirror"
            exit 1
          fi
          echo "PASS: end-to-end mock sync mirrored 2 matching commits with rewritten author"

      - name: Privacy migrate purges legacy README (e2e)
        run: |
          set -e
          base=/tmp/e2e-migrate
          mirror="$base/mirror"
          mirror_bare="$base/mirror-bare"
          cfg="$base/config"
          rm -rf "$base"
          mkdir -p "$base"

          git init --bare --quiet "$mirror_bare"
          git -C "$mirror_bare" symbolic-ref HEAD refs/heads/main
          git init --quiet "$mirror"
          cd "$mirror"
          git config user.email "work@corp.test"
          git config user.name "Work Identity"
          git remote add origin "$mirror_bare"

          # Recreate a legacy (<=1.8.1) mirror: init commit, activity commits,
          # generated README + status commit (full generator signature)
          git commit --allow-empty -m "init" --quiet
          GIT_AUTHOR_DATE="2026-04-01 10:00:00 +0530" GIT_COMMITTER_DATE="2026-04-01 10:00:00 +0530" \
            git commit --allow-empty -m "fix: secret work subject" --quiet
          GIT_AUTHOR_DATE="2026-04-02 11:00:00 +0530" GIT_COMMITTER_DATE="2026-04-02 11:00:00 +0530" \
            git commit --allow-empty -m "sync" --quiet
          {
            echo "# Work Contributions Mirror"
            echo ""
            echo "This repository mirrors commit timestamps only from private work repositories to maintain GitHub contribution visibility."
            echo ""
            echo "## Overview"
            echo ""
            echo "| Total Commits | **2** |"
            echo ""
            echo "## Repository Breakdown"
            echo ""
            echo "| \`secret-repo\` | 2 | 100% |"
            echo ""
            echo "## Sync Info"
            echo ""
            echo "<sub>Generated by [greens](https://github.com/yuvrajangadsingh/greens)</sub>"
          } > README.md
          git add README.md
          git commit -m "Update sync status" --quiet
          # Activity commit AFTER the status commit: its tree carries README.md
          # (the v1.8.1 trap) — it must be RETAINED and rebuilt empty.
          GIT_AUTHOR_DATE="2026-04-03 09:00:00 -0700" GIT_COMMITTER_DATE="2026-04-03 09:00:00 -0700" \
            git commit --allow-empty -m "sync" --quiet
          git branch -M main
          git push origin main --quiet
          cd - >/dev/null

          # Custom writable ref at the legacy tip (the leak path): migration
          # must delete it in the same atomic push
          git -C "$mirror_bare" update-ref refs/notes/leak "$(git -C "$mirror" rev-parse main)"

          cat > "$cfg" <<EOF
          WORK_DIR="$base/nowork"
          EMAILS="ci@test.com"
          REMOTE_PREFIX="$base/none/"
          MIRROR_DIR="$mirror"
          MIRROR_EMAIL="personal@test.com"
          ACTIVITY_TYPES="commits"
          EOF

          # Record the expected retained date tuples (activity commits only)
          git -C "$mirror" log --format='%s%x09%at %ai %ct %ci' main | \
            awk -F'\t' '$1 != "init" && $1 != "Update sync status" {print $2}' | sort > "$base/expected_tuples"

          # 1) sync must REFUSE on the legacy README (exit 3)
          rc=0
          CONTRIB_MIRROR_CONFIG="$cfg" FORCE=1 bash sync.sh </dev/null >"$base/refuse.log" 2>&1 || rc=$?
          grep -i "privacy-migrate" "$base/refuse.log"
          if [ "$rc" -ne 3 ]; then
            echo "FAIL: expected refusal exit 3, got $rc"
            cat "$base/refuse.log"
            exit 1
          fi
          echo "PASS: sync refused with exit 3"

          # 2) scripted YES migrate (local bare remote: visibility check N/A)
          printf 'YES\n' | CONTRIB_MIRROR_CONFIG="$cfg" bash sync.sh --privacy-migrate

          # 3) assertions on the rewritten remote (fresh clone = reachability)
          check="$base/check"
          git clone --quiet "$mirror_bare" "$check"
          count="$(git -C "$check" rev-list --count HEAD)"
          [ "$count" -eq 3 ] || { echo "FAIL: expected 3 commits, got $count"; git -C "$check" log --oneline; exit 1; }
          if git -C "$check" log --format='%s' | grep -qv '^sync$'; then
            echo "FAIL: messages not redacted"; git -C "$check" log --oneline; exit 1
          fi
          if git -C "$check" log --format='%an %ae %cn %ce' | grep -v '^greens personal@test.com greens personal@test.com$'; then
            echo "FAIL: identity not rewritten"; exit 1
          fi
          if git -C "$check" log --format='%T' | grep -v '4b825dc642cb6eb9a060e54bf8d69288fbee4904'; then
            echo "FAIL: non-empty tree survived (README not purged)"; exit 1
          fi
          if git -C "$check" rev-list --objects --all | grep -i readme; then
            echo "FAIL: README object still reachable"; exit 1
          fi
          dates="$(git -C "$check" log --format='%at %ai %ct %ci' | sort)"
          [ "$dates" = "$(sort "$base/expected_tuples")" ] || { echo "FAIL: date tuples changed"; echo "$dates"; exit 1; }
          grep -q 'COPY_MESSAGES="${COPY_MESSAGES:-0}"' "$cfg"
          grep -q 'GREENS_HISTORY_FORMAT' "$cfg"
          ls "$HOME/.contrib-mirror/backups/" | grep -q '\.bundle$' || { echo "FAIL: no backup bundle"; exit 1; }
          # COMPLETE advertised ref set: only the default branch may remain —
          # the refs/notes/leak stray must be gone
          refset="$(git ls-remote "$mirror_bare" | grep -v '\^{}' | awk '$2 != "HEAD" {print $2}')"
          [ "$refset" = "refs/heads/main" ] || { echo "FAIL: stray refs survived migration: $refset"; exit 1; }
          echo "PASS: migrate rewrote history (identities, messages, README, full date tuples, complete ref set)"

          # 3b) idempotency: second run = no prompt, no push, same tip
          tip_before="$(git ls-remote "$mirror_bare" refs/heads/main | awk '{print $1}')"
          out="$(CONTRIB_MIRROR_CONFIG="$cfg" bash sync.sh --privacy-migrate </dev/null)"
          echo "$out" | grep -q "nothing to migrate" || { echo "FAIL: second migrate not a no-op"; echo "$out"; exit 1; }
          tip_after="$(git ls-remote "$mirror_bare" refs/heads/main | awk '{print $1}')"
          [ "$tip_before" = "$tip_after" ] || { echo "FAIL: second migrate moved the remote tip"; exit 1; }
          echo "PASS: second migrate is a no-op"

          # 4) migrate ABORTS on foreign content, mirror untouched
          rm -rf "$base"
          mkdir -p "$base"
          git init --bare --quiet "$mirror_bare"
          git -C "$mirror_bare" symbolic-ref HEAD refs/heads/main
          git init --quiet "$mirror"
          cd "$mirror"
          git config user.email "u@test.com"
          git config user.name "U"
          git remote add origin "$mirror_bare"
          echo "my notes" > notes.txt
          git add notes.txt
          git commit -m "user file" --quiet
          git branch -M main
          git push origin main --quiet
          cd - >/dev/null
          cat > "$cfg" <<EOF
          MIRROR_DIR="$mirror"
          MIRROR_EMAIL="personal@test.com"
          EOF
          refs_before="$(git ls-remote "$mirror_bare" | sort)"
          rc=0
          printf 'YES\n' | CONTRIB_MIRROR_CONFIG="$cfg" bash sync.sh --privacy-migrate >"$base/abort.log" 2>&1 || rc=$?
          grep -q "ABORT" "$base/abort.log"
          [ "$rc" -ne 0 ] || { echo "FAIL: migrate should abort on user content"; exit 1; }
          refs_after="$(git ls-remote "$mirror_bare" | sort)"
          [ "$refs_before" = "$refs_after" ] || { echo "FAIL: remote refs changed on abort"; exit 1; }
          tip_msg="$(git -C "$mirror" log -1 --format='%s')"
          [ "$tip_msg" = "user file" ] || { echo "FAIL: mirror was modified"; exit 1; }
          [ -f "$mirror/notes.txt" ] || { echo "FAIL: user file lost"; exit 1; }
          echo "PASS: migrate aborted; remote ref OIDs and user content unchanged"

          # 5) a foreign ref pointing at a NON-COMMIT object also aborts
          rm -rf "$base"
          mkdir -p "$base"
          git init --bare --quiet "$mirror_bare"
          git -C "$mirror_bare" symbolic-ref HEAD refs/heads/main
          git init --quiet "$mirror"
          cd "$mirror"
          git config user.email "u@test.com"
          git config user.name "U"
          git remote add origin "$mirror_bare"
          GIT_AUTHOR_DATE="2026-04-01 10:00:00 +0530" GIT_COMMITTER_DATE="2026-04-01 10:00:00 +0530" \
            git commit --allow-empty -m "sync" --quiet
          git branch -M main
          git push origin main --quiet
          cd - >/dev/null
          blob="$(echo "user data" | git -C "$mirror_bare" hash-object -w --stdin)"
          git -C "$mirror_bare" update-ref refs/junk/x "$blob"
          cat > "$cfg" <<EOF
          MIRROR_DIR="$mirror"
          MIRROR_EMAIL="personal@test.com"
          EOF
          refs_before="$(git ls-remote "$mirror_bare" | sort)"
          rc=0
          printf 'YES\n' | CONTRIB_MIRROR_CONFIG="$cfg" bash sync.sh --privacy-migrate >"$base/junkref.log" 2>&1 || rc=$?
          grep -q "refs/junk/x" "$base/junkref.log"
          [ "$rc" -ne 0 ] || { echo "FAIL: migrate should abort on a non-commit ref"; exit 1; }
          refs_after="$(git ls-remote "$mirror_bare" | sort)"
          [ "$refs_before" = "$refs_after" ] || { echo "FAIL: remote refs changed on non-commit-ref abort"; exit 1; }
          echo "PASS: non-commit foreign ref aborted pre-mutation, refs unchanged"

      - name: Dashboard README is written only on verified-private mirrors
        run: |
          set -e
          base=/tmp/e2e-dashboard
          rm -rf "$base"
          mkdir -p "$base/home" "$base/github-alias" "$base/bin" "$base/plainpath" "$base/work" "$base/workremote"

          # gh STUB answering the visibility query from a state file
          cat > "$base/bin/gh" <<EOF
          #!/bin/bash
          case "\${1:-}" in
            auth) exit 0 ;;
            repo) cat "$base/vis.state" 2>/dev/null; exit 0 ;;
            *) exit 1 ;;
          esac
          EOF
          chmod +x "$base/bin/gh"
          echo PRIVATE > "$base/vis.state"

          # raw mirror URL is a plain path; insteadOf maps it to a local path
          # that contains "github", driving the real visibility code path
          cat > "$base/home/.gitconfig" <<EOF
          [user]
          	name = T
          	email = t@t.com
          [url "$base/github-alias/mirror.git"]
          	insteadOf = $base/plainpath/mirror.git
          EOF

          git init --bare --quiet "$base/github-alias/mirror.git"
          git -C "$base/github-alias/mirror.git" symbolic-ref HEAD refs/heads/main
          git init --quiet "$base/mirror"
          git -C "$base/mirror" remote add origin "$base/plainpath/mirror.git"

          git init --bare --quiet "$base/workremote/repo-one.git"
          git -C "$base/workremote/repo-one.git" symbolic-ref HEAD refs/heads/main
          git clone --quiet "$base/workremote/repo-one.git" "$base/work/repo-one" 2>/dev/null
          GIT_AUTHOR_NAME=W GIT_AUTHOR_EMAIL=w@corp.test GIT_COMMITTER_NAME=W GIT_COMMITTER_EMAIL=w@corp.test \
          GIT_AUTHOR_DATE="2026-04-05 12:00:00 +0530" GIT_COMMITTER_DATE="2026-04-05 12:00:00 +0530" \
            git -C "$base/work/repo-one" commit --allow-empty -qm "real work"
          git -C "$base/work/repo-one" push -q origin HEAD

          cat > "$base/cfg" <<EOF
          WORK_DIR="$base/work"
          EMAILS="w@corp.test"
          REMOTE_PREFIX="$base/workremote/"
          MIRROR_DIR="$base/mirror"
          MIRROR_EMAIL="personal@test.com"
          ACTIVITY_TYPES="commits"
          CACHE_DIR="$base/cache"
          LOG_DIR="$base/logs"
          EOF

          # PRIVATE: sync writes the dashboard, status commit is the neutral identity
          CONTRIB_MIRROR_CONFIG="$base/cfg" HOME="$base/home" PATH="$base/bin:$PATH" FORCE=1 \
            bash sync.sh </dev/null
          grep -q "Repository Breakdown" "$base/mirror/README.md"
          grep -q 'repo-one' "$base/mirror/README.md"
          tip="$(git -C "$base/mirror" log -1 --format='%s|%an|%ae')"
          [ "$tip" = "Update sync status|greens-status|status@greens.local" ] || { echo "FAIL: status identity: $tip"; exit 1; }
          echo "PASS: private mirror got the dashboard with a neutral status identity"

          # fresh dashboard must NOT trip the gate on the next run
          CONTRIB_MIRROR_CONFIG="$base/cfg" HOME="$base/home" PATH="$base/bin:$PATH" FORCE=1 \
            bash sync.sh </dev/null
          echo "PASS: second private sync runs clean over its own dashboard"

          # PUBLIC: dashboard history + public visibility refuses with exit 3
          echo PUBLIC > "$base/vis.state"
          rc=0
          CONTRIB_MIRROR_CONFIG="$base/cfg" HOME="$base/home" PATH="$base/bin:$PATH" FORCE=1 \
            bash sync.sh </dev/null >"$base/public.log" 2>&1 || rc=$?
          [ "$rc" -eq 3 ] || { echo "FAIL: expected exit 3 on public dashboard history, got $rc"; cat "$base/public.log"; exit 1; }
          grep -q "not verified PRIVATE" "$base/public.log"
          echo "PASS: public mirror with dashboard history refuses (exit 3)"

          # a public mirror with NO dashboard history syncs but never writes one
          rm -rf "$base/mirror2"
          git init --bare --quiet "$base/github-alias/mirror2.git"
          git -C "$base/github-alias/mirror2.git" symbolic-ref HEAD refs/heads/main
          git init --quiet "$base/mirror2"
          git -C "$base/mirror2" remote add origin "$base/github-alias/mirror2.git"
          sed -i '' -e "s|$base/mirror\"|$base/mirror2\"|" "$base/cfg" 2>/dev/null || \
            sed -i -e "s|$base/mirror\"|$base/mirror2\"|" "$base/cfg"
          CONTRIB_MIRROR_CONFIG="$base/cfg" HOME="$base/home" PATH="$base/bin:$PATH" FORCE=1 \
            bash sync.sh </dev/null
          [ ! -f "$base/mirror2/README.md" ] || { echo "FAIL: dashboard written on a public mirror"; exit 1; }
          echo "PASS: public mirror synced without any repo-names README"

      - name: Discovery accepts SSH, HTTPS, git:// clone forms for configured org
        run: |
          # Regression test: a repo cloned via HTTPS from the same org must be
          # discovered and normalized to REMOTE_PREFIX, not silently skipped.
          tmp="$(mktemp -d)"
          work="$tmp/work" mirror="$tmp/mirror" cache="$tmp/cache" cfg="$tmp/config"
          mkdir -p "$work" "$mirror" "$cache"

          # Fake repos with different origin forms
          init_repo() {
            local dir="$1" url="$2"
            mkdir -p "$dir" && git -C "$dir" init -q
            [ -n "$url" ] && git -C "$dir" remote add origin "$url"
            GIT_AUTHOR_EMAIL=test@test.com GIT_COMMITTER_EMAIL=test@test.com \
              git -C "$dir" commit --allow-empty -m init -q
          }
          init_repo "$work/repo-ssh"       'git@github-work:TestOrg/repo-ssh.git'
          init_repo "$work/repo-https"     'https://github.com/TestOrg/repo-https.git'
          init_repo "$work/repo-other"     'git@github.com:OtherOrg/repo-other.git'
          init_repo "$work/repo-similar"   'https://github.com/TestOrg-Labs/repo-similar.git'
          init_repo "$work/repo-no-remote" ''

          # Seed mirror repo
          git -C "$mirror" init -q
          GIT_AUTHOR_EMAIL=test@test.com GIT_COMMITTER_EMAIL=test@test.com \
            git -C "$mirror" commit --allow-empty -m init -q

          # Test config (script sources this as the final override)
          cat > "$cfg" <<EOF
          WORK_DIR=$work
          MIRROR_DIR=$mirror
          CACHE_DIR=$cache
          REMOTE_PREFIX="git@github-work:TestOrg/"
          EMAILS="test@test.com"
          MIRROR_EMAIL="test@test.com"
          GITHUB_USERNAME="testuser"
          ACTIVITY_TYPES="commits"
          SINCE="2024-01-01 00:00:00"
          EOF

          # Run sync. Fetches will fail (remotes are fake) — we only assert on
          # the discovery log lines, which run before any network call.
          out="$(CONTRIB_MIRROR_CONFIG="$cfg" FORCE=1 bash sync.sh 2>&1 || true)"
          echo "--- sync output ---"
          echo "$out"
          echo "--- end output ---"

          assert() {
            if [ "$1" = "pass" ]; then echo "PASS: $2"
            else echo "FAIL: $2"; exit 1; fi
          }

          # Both valid forms must reach the caching step
          echo "$out" | grep -q 'repo-ssh.git'      && assert pass 'SSH repo discovered'      || assert fail 'SSH repo discovered'
          echo "$out" | grep -q 'repo-https.git'    && assert pass 'HTTPS repo discovered'    || assert fail 'HTTPS repo discovered'
          echo "$out" | grep -q 'normalizing.*repo-https' && assert pass 'HTTPS form logged a normalization WARN' || assert fail 'HTTPS form logged a normalization WARN'

          # Non-matching org and missing remote must be skipped
          echo "$out" | grep -q 'repo-other'        && assert fail 'unrelated org was skipped'    || assert pass 'unrelated org was skipped'
          echo "$out" | grep -q 'repo-no-remote'    && assert fail 'no-remote repo was skipped'   || assert pass 'no-remote repo was skipped'

          # Substring-collision safety: TestOrg-Labs must not match TestOrg
          echo "$out" | grep -q 'repo-similar'      && assert fail 'substring-org rejected'       || assert pass 'substring-org rejected'

      - name: Fetch timeout kills a stuck SSH transport
        run: |
          # Regression test: when ssh hangs mid-transfer (no data, no close),
          # sync.sh must kill the fetch within GREENS_FETCH_TIMEOUT + grace
          # instead of wedging the whole sync for hours.
          tmp="$(mktemp -d)"
          work="$tmp/work" mirror="$tmp/mirror" cache="$tmp/cache" cfg="$tmp/config"
          mkdir -p "$work" "$mirror" "$cache"

          # Fake SSH wrapper that never returns — simulates the midnight stall
          # we actually observed in production (ssh alive, no bytes flowing).
          cat > "$tmp/slow-ssh" <<'SSHEOF'
          #!/bin/bash
          sleep 600
          SSHEOF
          chmod +x "$tmp/slow-ssh"

          mkdir -p "$work/slow-repo"
          git -C "$work/slow-repo" init -q
          git -C "$work/slow-repo" remote add origin git@github.com:TestOrg/slow-repo.git
          GIT_AUTHOR_EMAIL=test@test.com GIT_COMMITTER_EMAIL=test@test.com \
            git -C "$work/slow-repo" commit --allow-empty -m init -q

          git -C "$mirror" init -q
          GIT_AUTHOR_EMAIL=test@test.com GIT_COMMITTER_EMAIL=test@test.com \
            git -C "$mirror" commit --allow-empty -m init -q

          cat > "$cfg" <<EOF
          WORK_DIR=$work
          MIRROR_DIR=$mirror
          CACHE_DIR=$cache
          REMOTE_PREFIX="git@github.com:TestOrg/"
          EMAILS="test@test.com"
          MIRROR_EMAIL="test@test.com"
          GITHUB_USERNAME="testuser"
          ACTIVITY_TYPES="commits"
          SINCE="2024-01-01 00:00:00"
          EOF

          # Full stdout to a file; no head/tee pipeline that can short-circuit
          # the child via SIGPIPE and make the timer reading unreliable.
          start="$(date +%s)"
          CONTRIB_MIRROR_CONFIG="$cfg" FORCE=1 GREENS_FETCH_TIMEOUT=5 \
            GIT_SSH_COMMAND="$tmp/slow-ssh" \
            bash sync.sh >"$tmp/out.log" 2>&1 || true
          elapsed="$(( $(date +%s) - start ))"

          echo "--- sync output (first 20 lines) ---"
          sed -n '1,20p' "$tmp/out.log" || true
          echo "--- end output ---"
          echo "elapsed=${elapsed}s"

          # Budget: timeout (5) + grace (10) + overhead (~15) = 30s realistic.
          # If it takes 60+ seconds the wrapper didn't actually kill ssh.
          if [ "$elapsed" -lt 60 ]; then
            echo "PASS: fetch timeout kicked in (${elapsed}s)"
          else
            echo "FAIL: sync took ${elapsed}s, timeout wrapper didn't kill ssh"
            exit 1
          fi

          # Sync should log the warn for the failed repo before aborting.
          if grep -q 'WARN.*slow-repo' "$tmp/out.log"; then
            echo "PASS: failed fetch logged with WARN"
          else
            echo "FAIL: expected WARN for slow-repo in output"
            cat "$tmp/out.log"
            exit 1
          fi

      - name: Perl timeout fallback kills process group
        run: |
          # Exercise the perl fallback directly, without relying on a fragile
          # PATH shim for sync.sh. This validates the bit of logic that kicks
          # in when gtimeout/timeout are missing.
          run_with_timeout() {
            local seconds="$1"; shift
            perl -e 'setpgrp 0,0; exec @ARGV or die "exec failed: $!"' "$@" &
            local pid=$!
            (
              sleep "$seconds"
              kill -TERM -"$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null
              sleep 10
              kill -KILL -"$pid" 2>/dev/null || kill -KILL "$pid" 2>/dev/null
            ) &
            local watcher=$!
            wait "$pid" 2>/dev/null
            local rc=$?
            kill "$watcher" 2>/dev/null
            wait "$watcher" 2>/dev/null
            return "$rc"
          }

          # Unique sentinel so the orphan check can't collide with unrelated
          # `sleep` processes on the runner.
          marker="greens-timeout-test-$RANDOM-$$"
          start="$(date +%s)"
          run_with_timeout 2 bash -c "exec -a $marker sleep 600" || true
          elapsed="$(( $(date +%s) - start ))"
          echo "elapsed=${elapsed}s"
          if [ "$elapsed" -lt 30 ]; then
            echo "PASS: perl fallback killed child (${elapsed}s)"
          else
            echo "FAIL: perl fallback didn't kill child within budget (${elapsed}s)"
            exit 1
          fi

          # Confirm the sentinel-named child didn't leak out of the wrapper.
          if pgrep -f "$marker" >/dev/null 2>&1; then
            echo "FAIL: orphan child still running after wrapper returned"
            pkill -9 -f "$marker" 2>/dev/null || true
            exit 1
          else
            echo "PASS: no orphan child after wrapper returned"
          fi

  # Windows smoke tests (Git Bash)
  test-windows:
    runs-on: windows-latest
    steps:
      # No autocrlf override — let .gitattributes do its job (real user scenario)
      - uses: actions/checkout@v4

      # --- Line endings (.gitattributes must work without autocrlf tweaks) ---
      - name: Shell scripts have LF endings
        shell: bash
        run: |
          fail=0
          for f in sync.sh setup.sh; do
            if grep -Prl '\r$' "$f" >/dev/null 2>&1; then
              echo "FAIL: $f has CRLF (gitattributes not working)"
              fail=1
            fi
          done
          exit $fail

      # --- Git Bash discovery (same logic as setup.sh) ---
      - name: Git Bash found at expected path
        shell: bash
        run: |
          found=""
          for p in \
            "/c/Program Files/Git/bin/bash.exe" \
            "/c/Program Files (x86)/Git/bin/bash.exe" \
            "${LOCALAPPDATA:-}/Programs/Git/bin/bash.exe"; do
            if [[ -f "$p" ]]; then
              found="$p"
              break
            fi
          done
          [[ -n "$found" ]] || { echo "FAIL: Git Bash not found at any expected path"; exit 1; }
          echo "Found: $found"

      # --- Path conversion ---
      - name: cygpath converts paths
        shell: bash
        run: |
          win=$(cygpath -w "$(pwd)")
          echo "cygpath -w = $win"
          [[ "$win" == *\\* ]] || { echo "FAIL: -w should have backslashes"; exit 1; }

          mixed=$(cygpath -m "$(pwd)")
          echo "cygpath -m = $mixed"
          [[ "$mixed" == *:/* ]] || { echo "FAIL: -m should produce C:/..."; exit 1; }

      - name: MSYS_NO_PATHCONV works with schtasks
        shell: bash
        run: |
          # Test that MSYS_NO_PATHCONV actually prevents mangling when calling a real exe.
          # Without it, /Query can get converted to C:/Query by MSYS.
          # We call schtasks with a bogus task name — error is expected, but the error
          # message proves the switch reached schtasks unmangled.
          export MSYS_NO_PATHCONV=1
          output="$(schtasks.exe /Query /TN "greens-ci-pathconv-test" 2>&1)" || true
          echo "schtasks output: $output"
          # If path mangling happened, schtasks wouldn't recognize the switch and
          # would print generic usage. A proper /Query with bad TN says "not found" or similar.
          if echo "$output" | grep -qi "ERROR\|not found\|does not exist\|cannot find"; then
            echo "OK: schtasks received /Query correctly (task not found, as expected)"
          else
            echo "FAIL: schtasks output doesn't look like a valid /Query response"
            exit 1
          fi

      # --- greens.cmd launcher ---
      - name: greens.cmd finds Git Bash
        shell: cmd
        run: greens.cmd --version

      - name: greens.cmd passes arguments with spaces
        shell: cmd
        run: greens.cmd --help

      # --- sync.sh under Git Bash ---
      - name: Version
        shell: bash
        run: bash sync.sh --version

      - name: Help
        shell: bash
        run: bash sync.sh --help

      - name: Status (no config)
        shell: bash
        run: bash sync.sh --status

      - name: Reset (no config, say no)
        shell: bash
        run: echo "n" | bash sync.sh --reset

      # --- Setup wizard (Windows scheduler path) ---
      - name: Setup wizard (non-interactive, Windows Task Scheduler)
        shell: bash
        run: |
          # Git identity needed for commits on Windows runner
          git config --global user.email "ci@test.com"
          git config --global user.name "CI"

          # Create a temp work dir with a fake git repo
          mkdir -p /tmp/test-work/fake-repo
          cd /tmp/test-work/fake-repo
          git init
          git remote add origin https://github.com/test-org/test-repo.git
          cd -

          # Create a temp mirror repo
          mkdir -p /tmp/test-mirror
          cd /tmp/test-mirror
          git init
          git commit --allow-empty -m "init"
          git remote add origin https://github.com/testuser/test-mirror.git
          cd -

          # Pipe inputs to setup wizard. On Windows, IS_WINDOWS=true changes the
          # scheduler menu (Windows Task Scheduler instead of launchd/cron).
          #
          # Prompt order (traced from previous CI log):
          #   1. work dir
          #   2. PAT ready? (n)
          #   3. enter token now? (n)
          #   4. emails
          #   5. org name
          #   6. github username (empty)
          #   7. mirror email
          #   8. personal github username
          #   9. since (empty)
          #   10. copy messages (n)
          #   11. push token ready? (n)
          #   12. paste token now? (n)
          #   13. fix-push choice (3 = skip)
          #   14. scheduler choice (1 = Windows Task Scheduler)
          #   15. sync hour (9)
          #
          # schtasks may fail due to runner permissions — that's fine,
          # we just need setup.sh to reach the scheduler code path without crashing.
          printf '/tmp/test-work\nn\nn\ntest@test.com\ntest-org\n\npersonal@test.com\ntestuser\n\nn\nn\nn\n3\n1\n9\n' \
            | MIRROR_DIR=/tmp/test-mirror timeout 60 bash setup.sh 2>&1 || true

          # Verify config was created
          if [ -f "$HOME/.contrib-mirror/config" ]; then
            echo "PASS: Config created"
            cat "$HOME/.contrib-mirror/config"
          else
            echo "WARN: Config not created (setup may have hit EOF on prompts)"
          fi

      - name: Status (with config, Windows)
        shell: bash
        run: |
          if [ -f "$HOME/.contrib-mirror/config" ]; then
            bash sync.sh --status
          else
            echo "Skipping — no config from setup test"
          fi

      # --- schtasks.exe create/query/delete cycle ---
      - name: schtasks create-query-delete cycle
        shell: bash
        run: |
          export MSYS_NO_PATHCONV=1
          task="greens-ci-test-$$"
          bash_path="$(cygpath -w "/c/Program Files/Git/bin/bash.exe" 2>/dev/null || echo "C:\\Program Files\\Git\\bin\\bash.exe")"

          # Create — may fail on permissions, that's informational
          if schtasks.exe /Create /TN "$task" \
            /TR "\"$bash_path\" --login -c \"echo hello\"" \
            /SC DAILY /ST 00:00 /F 2>&1; then
            echo "PASS: schtasks /Create succeeded"

            # Query
            output="$(schtasks.exe /Query /TN "$task" 2>&1)" || true
            echo "Query output: $output"
            if echo "$output" | grep -qi "$task"; then
              echo "PASS: schtasks /Query found the task"
            else
              echo "FAIL: task not found after create"
              exit 1
            fi

            # Delete
            schtasks.exe /Delete /TN "$task" /F 2>&1 || true
            echo "PASS: schtasks /Delete ran"
          else
            echo "WARN: schtasks /Create failed (expected on GHA — runner lacks admin)"
            echo "Skipping query/delete (no task to test)"
          fi

      # /Create returning ok only proves the task was registered. /Run + the
      # task's "Last Result" exit code is the deterministic signal that the
      # action actually executed. Avoids file-marker path semantics between
      # bash, schtasks, and the scheduled-task user context.
      - name: schtasks /Run executes the task action
        shell: bash
        run: |
          export MSYS_NO_PATHCONV=1
          task="greens-ci-run-$$"
          bash_path="$(cygpath -w "/c/Program Files/Git/bin/bash.exe" 2>/dev/null || echo "C:\\Program Files\\Git\\bin\\bash.exe")"

          if schtasks.exe /Create /TN "$task" \
              /TR "\"$bash_path\" --login -c \"exit 0\"" \
              /SC DAILY /ST 23:59 /F 2>&1; then
            echo "PASS: schtasks /Create"

            if schtasks.exe /Run /TN "$task" 2>&1; then
              # Wait for task to finish so Last Result reflects this run
              for i in $(seq 1 20); do
                status=$(schtasks.exe /Query /TN "$task" /FO LIST 2>&1 | grep -i "^Status:" | awk -F: '{print $2}' | tr -d ' \r')
                [ "$status" = "Ready" ] && break
                sleep 1
              done

              last_result=$(schtasks.exe /Query /TN "$task" /V /FO LIST 2>&1 | grep -i "^Last Result:" | awk -F: '{print $2}' | tr -d ' \r')
              echo "Last Result: $last_result"
              if [ "$last_result" = "0" ]; then
                echo "PASS: task action executed and exited 0"
              else
                echo "FAIL: task action exited with $last_result (expected 0)"
                schtasks.exe /Query /TN "$task" /V /FO LIST 2>&1 | head -30 || true
                schtasks.exe /Delete /TN "$task" /F 2>&1 || true
                exit 1
              fi
            else
              echo "WARN: schtasks /Run returned non-zero (likely runner lacks privilege)"
            fi

            schtasks.exe /Delete /TN "$task" /F 2>&1 || true
          else
            echo "WARN: schtasks /Create failed (no admin), skipping /Run test"
          fi

      - name: End-to-end mock sync (Windows)
        shell: bash
        run: |
          set -e
          # Earlier setup-wizard step already configures git identity, but this
          # step also runs standalone on rerun, so set it idempotently
          git config --global user.email "ci@test.com" || true
          git config --global user.name "CI" || true

          base=/tmp/e2e-windows
          src="$base/source.git"
          work="$base/work"
          mirror="$base/mirror"
          mirror_bare="$base/mirror-bare"
          cache="$base/cache"
          cfg="$base/config"
          rm -rf "$base"
          mkdir -p "$base" "$work" "$mirror" "$cache"

          git init --bare --quiet "$src"

          tmp="$base/tmp-clone"
          git clone --quiet "$src" "$tmp"
          cd "$tmp"
          git config user.email "ci@test.com"
          git config user.name "CI"
          GIT_AUTHOR_DATE="2026-04-01T10:00:00" GIT_COMMITTER_DATE="2026-04-01T10:00:00" \
            git commit --allow-empty -m "matching commit 1" --quiet
          GIT_AUTHOR_DATE="2026-04-02T11:00:00" GIT_COMMITTER_DATE="2026-04-02T11:00:00" \
            git commit --allow-empty -m "matching commit 2" --quiet
          GIT_AUTHOR_EMAIL="other@test.com" GIT_COMMITTER_EMAIL="other@test.com" \
            GIT_AUTHOR_DATE="2026-04-03T12:00:00" GIT_COMMITTER_DATE="2026-04-03T12:00:00" \
            git commit --allow-empty -m "non-matching commit" --quiet
          git push -u origin HEAD --quiet
          cd - >/dev/null

          git clone --quiet "$src" "$work/source-repo"

          # Git Bash may store local paths in mixed C:/... form; reading the
          # actual origin URL avoids a prefix-spelling mismatch in sync.sh
          origin_url="$(git -C "$work/source-repo" remote get-url origin)"
          remote_prefix="${origin_url%source.git}"
          echo "Origin URL: $origin_url"
          echo "REMOTE_PREFIX: $remote_prefix"

          git init --bare --quiet "$mirror_bare"
          cd "$mirror"
          git init --quiet
          git config user.email "init@test.com"
          git config user.name "Init"
          git remote add origin "$mirror_bare"
          git commit --allow-empty -m "init" --quiet
          git branch -M main
          git push origin main --quiet
          cd - >/dev/null

          # GITHUB_USERNAME omitted on purpose: setting it activates sync.sh's
          # gh-API branch (gh search prs / gh auth switch), which needs auth
          # the runner doesn't have. PERSONAL_GH_USER is read only by setup.sh.
          cat > "$cfg" <<EOF
          WORK_DIR="$work"
          EMAILS="ci@test.com"
          REMOTE_PREFIX="$remote_prefix"
          MIRROR_DIR="$mirror"
          MIRROR_EMAIL="mirror@test.com"
          SINCE="2026-01-01 00:00:00"
          COPY_MESSAGES="0"
          EOF

          CONTRIB_MIRROR_CONFIG="$cfg" CACHE_DIR="$cache" \
            bash sync.sh 2>&1 | tail -50

          count=$(git -C "$mirror" rev-list --count HEAD)
          echo "Mirror commits: $count"
          if [ "$count" -lt 3 ]; then
            echo "FAIL: expected >=3 (init + 2 mirrored), got $count"
            git -C "$mirror" log --oneline
            exit 1
          fi
          authors=$(git -C "$mirror" log --format='%ae' | sort -u | tr '\n' ' ')
          echo "Authors: $authors"
          if ! echo "$authors" | grep -q "mirror@test.com"; then
            echo "FAIL: no commits authored by mirror@test.com"
            git -C "$mirror" log --pretty='%h %ae %s'
            exit 1
          fi
          if echo "$authors" | grep -q "ci@test.com"; then
            echo "FAIL: original work email leaked into mirror"
            exit 1
          fi
          if echo "$authors" | grep -q "other@test.com"; then
            echo "FAIL: non-matching email leaked into mirror"
            exit 1
          fi
          echo "PASS: Windows end-to-end sync mirrored 2 matching commits with rewritten author"

  # Test Homebrew install + upgrade (only on tags)
  test-brew:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Tap and install greens
        run: |
          brew tap yuvrajangadsingh/greens
          brew install greens

      - name: Version
        run: greens --version

      - name: Help
        run: greens --help

      - name: Status
        run: greens --status

      - name: Upgrade (no-op, validates command works)
        run: |
          brew upgrade greens 2>&1 || true
          greens --version
